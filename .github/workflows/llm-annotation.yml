name: Annotation harness

on:
  push:
    paths:
      - 'llm_annotation/**'
      - '.github/workflows/llm-annotation.yml'
  pull_request:
    paths:
      - 'llm_annotation/**'
      - '.github/workflows/llm-annotation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: llm_annotation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: llm_annotation/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[all]'
      - name: Offline tests and integrity checks
        run: python -B -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Validate the human-audit command without API calls
        run: locus-run human_audit --provider google --dry-run
